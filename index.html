<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a7a4b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calorie Coach">
<title>Calorie Coach</title>
<style>
:root{--bg:#eef3ee;--ink:#14261d;--mute:#5d6f64;--line:#cfd9d1;--acc:#2a7a4b;--onacc:#fff;--tint:#dcebe0;--warn:#b23a2a;--surf:#fbfdfb}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--ink:#e8f0ea;--mute:#8fa297;--line:#26362d;--acc:#5cc088;--onacc:#0c1a12;--tint:#1c2c23;--warn:#ef8372;--surf:#16201a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:460px;margin:0 auto;padding:20px 18px 48px}
h1,h2,.num{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600}
h1{font-size:1.7rem;margin:0;letter-spacing:-.01em}
h2{font-size:1.2rem;margin:0}
p{margin:6px 0}
.mute{color:var(--mute)}.small{font-size:.875rem}.warn{color:var(--warn)}
.hero{display:flex;gap:18px;align-items:center;margin:16px 0 8px}
.ring{width:132px;height:132px;flex:none}
.ring circle{fill:none;stroke-width:10}
.ring .bg{stroke:var(--tint)}
.ring .fg{stroke:var(--acc);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s}
.ring .fg.over{stroke:var(--warn)}
.ring text{fill:var(--ink);text-anchor:middle}
.big{font-size:2.1rem;line-height:1.1}
.meal{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
ul{list-style:none;margin:8px 0;padding:0}
li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
li small{color:var(--mute)}
li span:last-child{white-space:nowrap}
button,select,input{font:inherit;color:inherit}
.x{background:none;border:0;color:var(--mute);font-size:1.3rem;line-height:1;padding:4px 8px;margin-left:2px;cursor:pointer}
.add{display:flex;gap:8px;margin:10px 0}
.add select{flex:1;min-width:0}
select,input{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surf)}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:11px 16px;font-weight:600;cursor:pointer}
.ghost{background:none;color:var(--ink);border:1px solid var(--line);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.chip{background:var(--tint);border:0;border-radius:999px;padding:8px 12px;cursor:pointer;font-size:.9rem}
label{display:block;margin:12px 0;font-weight:500}
label>*{margin-top:5px;font-weight:400}
.row{display:flex;gap:8px;margin-top:22px}
.note{border-top:1px solid var(--line);margin-top:22px;padding-top:12px;color:var(--mute);font-size:.875rem}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.ring .fg{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
// name, serving, calories, meals it suits (b = breakfast, l = lunch, d = dinner)
const FOODS=[
["Oatmeal with water","1 bowl",150,"b"],["Oatmeal with milk","1 bowl",250,"b"],["Cereal with milk","1 bowl",250,"b"],
["Scrambled eggs","2 eggs",180,"bl"],["Boiled egg","1 egg",70,"bl"],["Whole wheat toast","1 slice",80,"bld"],
["Greek yogurt, plain","150 g",100,"bl"],["Cottage cheese","100 g",100,"bl"],["Banana","1 medium",105,"bld"],
["Apple","1 medium",95,"bld"],["Orange","1 medium",60,"bld"],["Blueberries","1 cup",85,"bl"],
["Milk, 2%","1 glass",120,"bld"],["Peanut butter","1 tbsp",95,"bl"],["Avocado","half",120,"bld"],
["Almonds","30 g",170,"bld"],["Cheese slice","1 slice",70,"bld"],["Turkey slices","50 g",60,"bld"],
["Grilled chicken breast","150 g",250,"ld"],["Salmon fillet","150 g",310,"ld"],["Lean beef steak","150 g",300,"ld"],
["Tuna in water","1 can",120,"ld"],["White rice, cooked","1 cup",200,"ld"],["Pasta, cooked","1 cup",220,"ld"],
["Boiled potatoes","200 g",160,"ld"],["Sweet potato","1 medium",110,"ld"],["Lentil soup","1 bowl",230,"ld"],
["Tomato soup","1 bowl",120,"ld"],["Chickpeas, cooked","1 cup",270,"ld"],["Vegetable stir-fry","1 plate",180,"ld"],
["Mixed salad","1 bowl",60,"ld"],["Steamed broccoli","1 cup",55,"ld"],["Carrots","1 cup",50,"bld"],
["Bread roll","1 roll",120,"ld"],["Hummus","2 tbsp",70,"ld"],["Olive oil","1 tbsp",120,"ld"],
["Chicken sandwich","1 sandwich",350,"l"],["Pizza slice","1 slice",285,"ld"],["Baked cod","150 g",140,"ld"],
["Tofu, firm","100 g",145,"ld"]
];
const ACT={little:1.2,light:1.375,moderate:1.55,high:1.725};
const MEALS=[["b","Breakfast",.30],["l","Lunch",.35],["d","Dinner",.35]];
const KEY="calorieCoachV1";
const NOTE='<p class="note">This app is not medical advice. Talk to a doctor or dietitian before you change your diet.</p>';
const OPTS=FOODS.map((f,i)=>[f,i]).sort((a,b)=>a[0][0].localeCompare(b[0][0]))
  .map(([f,i])=>`<option value="${i}">${f[0]} (${f[1]}), ${f[2]} cal</option>`).join("");
const $=id=>document.getElementById(id);
let S=load(),editing=false;
if(!S.log)S.log={};

function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function pad(n){return String(n).padStart(2,"0")}
function ymd(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function dayNum(start){
  const a=start.split("-").map(Number),b=ymd().split("-").map(Number);
  return Math.max(0,Math.round((Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2]))/864e5));
}
// Mifflin-St Jeor formula times the activity number
function need(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
  return Math.round(bmr*ACT[p.act]);
}
// goal drops 50 a day, at most 500 below need, never below the safe floor
function goalFor(p,n){
  const nd=need(p),floor=p.sex==="m"?1500:1200;
  return Math.min(nd,Math.max(floor,nd-Math.min(50*n,500)));
}
function suggest(k,left,items){
  return FOODS.map((f,i)=>({f,i}))
    .filter(o=>o.f[3].includes(k)&&o.f[2]<=left&&!items.includes(o.i))
    .sort((a,b)=>Math.abs(a.f[2]-left*.6)-Math.abs(b.f[2]-left*.6)).slice(0,3);
}
function day(){return S.log[ymd()]=S.log[ymd()]||{b:[],l:[],d:[]}}

function formHTML(){
  const p=S.p||{age:"",sex:"m",weight:"",height:"",act:"light"};
  const acts=[["little","Little: desk job, no exercise"],["light","Light: exercise 1 to 3 days a week"],["moderate","Moderate: exercise 3 to 5 days a week"],["high","High: hard exercise 6 to 7 days a week"]];
  return `<h1>Calorie Coach</h1>
<p class="mute">Tell the app about yourself. Your answers stay on this device.</p>
<div id="f">
<label>Age in years<input id="age" type="number" inputmode="numeric" value="${p.age}" required></label>
<label>Sex<select id="sex"><option value="m"${p.sex==="m"?" selected":""}>Male</option><option value="f"${p.sex==="f"?" selected":""}>Female</option></select></label>
<label>Weight in kg<input id="weight" type="number" step="0.1" inputmode="decimal" value="${p.weight}" required></label>
<label>Height in cm<input id="height" type="number" inputmode="numeric" value="${p.height}" required></label>
<label>How active are you?<select id="act">${acts.map(a=>`<option value="${a[0]}"${p.act===a[0]?" selected":""}>${a[1]}</option>`).join("")}</select></label>
<p id="err" class="warn" role="alert"></p>
<button class="btn" data-a="save">Save and start</button>
</div>${NOTE}`;
}

function render(){
  const app=$("app");
  if(!S.p||editing){app.innerHTML=formHTML();return}
  const p=S.p,n=dayNum(p.start),nd=need(p),goal=goalFor(p,n);
  const low=goal<nd&&goalFor(p,n+1)===goal;
  const d=S.log[ymd()]||{b:[],l:[],d:[]};
  const sums=MEALS.map(m=>d[m[0]].reduce((t,i)=>t+FOODS[i][2],0));
  const eaten=sums.reduce((a,b)=>a+b,0),left=goal-eaten,over=left<0;
  const off=(314.16*(1-Math.min(1,eaten/goal))).toFixed(1);
  const date=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  const meals=MEALS.map((m,j)=>{
    const k=m[0],items=d[k],budget=Math.round(goal*m[2]),ml=budget-sums[j],sg=ml>0?suggest(k,ml,items):[];
    const list=items.map((fi,x)=>`<li><span>${FOODS[fi][0]} <small>${FOODS[fi][1]}</small></span><span>${FOODS[fi][2]}<button class="x" data-a="del" data-k="${k}" data-i="${x}" aria-label="Remove ${FOODS[fi][0]}">&times;</button></span></li>`).join("");
    return `<section class="meal"><div class="head"><h2>${m[1]}</h2><span class="${ml<0?"warn":"mute"}">${ml<0?"over by "+(-ml):ml+" left"} of ${budget}</span></div>
<ul>${list||'<li class="mute">Nothing added yet</li>'}</ul>
<div class="add"><select id="sel-${k}" aria-label="Choose a food for ${m[1].toLowerCase()}">${OPTS}</select><button class="btn" data-a="addsel" data-k="${k}">Add</button></div>
<p class="mute small">${sg.length?"Ideas that fit. Tap one to add it:":"No food in the list fits the calories left."}</p>
<div class="chips">${sg.map(o=>`<button class="chip" data-a="add" data-k="${k}" data-i="${o.i}">${o.f[0]}, ${o.f[2]}</button>`).join("")}</div></section>`;
  }).join("");
  app.innerHTML=`<h1>Calorie Coach</h1>
<p class="mute">Day ${n+1}, ${date}</p>
<div class="hero">
<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${over?"Over the goal by "+(-left):left+" calories left"} today">
<circle class="bg" cx="60" cy="60" r="50"/>
<circle class="fg${over?" over":""}" cx="60" cy="60" r="50" stroke-dasharray="314.16" stroke-dashoffset="${off}"/>
<text class="num" x="60" y="64" font-size="26">${Math.abs(left)}</text>
<text x="60" y="82" font-size="10">${over?"calories over":"calories left"}</text></svg>
<div><p class="mute small">Goal for today</p><p class="num big">${goal}</p><p>Eaten so far: <b>${eaten}</b></p></div></div>
<p class="mute small">To keep your weight you need about ${nd} calories a day. Your goal goes down 50 calories each day.${low?" It has reached the lowest safe level, so it will not go down more.":""}</p>
${meals}
<div class="row"><button class="btn ghost" data-a="edit">Edit my details</button><button class="btn ghost" data-a="restart">Restart plan</button></div>${NOTE}`;
}

function saveForm(){
  const v=id=>$(id).value,age=+v("age"),w=+v("weight"),h=+v("height"),err=$("err");
  if(age<18||age>100){err.textContent="This app is for adults aged 18 to 100.";return}
  if(w<30||w>300||h<120||h>230){err.textContent="Check your numbers: weight 30 to 300 kg, height 120 to 230 cm.";return}
  S.p={age:age,sex:v("sex"),weight:w,height:h,act:v("act"),start:(S.p&&S.p.start)||ymd()};
  editing=false;save();render();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");
  if(!t)return;
  const a=t.dataset.a,k=t.dataset.k,i=t.dataset.i;
  if(a==="save"){saveForm();return}
  if(a==="add")day()[k].push(+i);
  else if(a==="addsel")day()[k].push(+$("sel-"+k).value);
  else if(a==="del")day()[k].splice(+i,1);
  else if(a==="edit")editing=true;
  else if(a==="restart"){if(!confirm("Start again from today? Your goal goes back to the starting number."))return;S.p.start=ymd()}
  save();render();
});
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
